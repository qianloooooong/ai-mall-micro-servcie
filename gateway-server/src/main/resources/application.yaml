server:
  port: 18080

spring:
  application:
    name: gateway-server
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848
      discovery:
        namespace: ai-mall
      config:
        namespace: ai-mall
    gateway:
      server:
        webflux:
          routes:
            - id: oauth-server
              uri: lb://oauth-server
              predicates:
                - Path=/auth/**,/oauth2/**,/login
            - id: user-server
              uri: lb://user-server
              predicates:
                - Path=/users/**
  config:
    import:
      - optional:nacos:gateway-jwt.yaml
      - optional:nacos:shared-log.yaml

