server:
  port: 18090
  servlet:
    session:
      tracking-modes: cookie
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        max-age: 12h

spring:
  application:
    name: oauth-server
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848
      discovery:
        namespace: ai-mall
      config:
        namespace: ai-mall
  config:
    import:
      - optional:nacos:oauth-jwt.yaml
      - optional:nacos:shared-log.yaml
      - optional:nacos:shared-redis.yaml
      - optional:nacos:frontend-url.yaml